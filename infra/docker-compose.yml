
networks:
  dr_network:
    driver: bridge

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16
    container_name: dr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dr_user
      POSTGRES_PASSWORD: dr_password
      POSTGRES_DB: distributed_resources
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_user -d distributed_resources"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dr_redis
    restart: unless-stopped
    networks:
      - dr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dr_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    ports:
      - "8000:8000"
    networks:
      - dr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: dr_worker
    restart: unless-stopped
    env_file:
      - ../worker/.env.production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dr_network
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dr_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - dr_network
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: dr_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - dr_network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: dr_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: drplatform2024
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dr-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - dr_network
    depends_on:
      - prometheus
