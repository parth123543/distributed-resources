version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dr_user
      POSTGRES_PASSWORD: dr_password
      POSTGRES_DB: distributed_resources
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_user -d distributed_resources"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: